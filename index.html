<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>欢迎使用虚拟家具系统</title>
  <link rel="stylesheet" href="css/animate.min.css" type="text/css" />
  <script type="text/javascript" src="js/Library/jquery-1.8.0.min.js"></script>

  <script type="text/javascript">

    function run() {
      var canvas = document.createElement("canvas");
      var gl = null;
      try {
        gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      } catch (e) {
      }

      var ua = navigator.userAgent;
      var bro = "浏览器版本为: ";
      if (/Edg\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Microsoft Edge";
      } else if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Chrome";
      } else if (/Firefox\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Firefox";
      } else if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Safari";
      } else if (/MSIE |Trident\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Microsoft Internet Explorer";
      } else if (/OPR\//.test(ua) || /Opera\//.test(ua)) {
        document.getElementById("BrowserVersion").textContent = bro + "Opera";
      }

      if (gl) {
        document.getElementById("BrowserVersion").textContent += "（支持 WebGL）";
      } else {
        document.getElementById("BrowserVersion").textContent =
          (document.getElementById("BrowserVersion").textContent.indexOf("浏览器版本") === 0
            ? document.getElementById("BrowserVersion").textContent
            : "未能识别浏览器") + "（不支持 WebGL，可能无法运行）";
      }

      if (location.protocol === "file:") {
        var tip = document.getElementById("LocalOpenTip");
        if (tip) tip.style.display = "block";
      }

      var img = new Image();
      img.src = "img/background.jpg";
    }


    function ButtonEffect(id, move) {

      $('#' + id + '').removeClass().addClass('animated ' + move + '');
      var wait = window.setTimeout(function () {
        $('#' + id + '').removeClass()
      },
        1300
      );


    }
  </script>

</head>

<body onLoad="run();">


  <div align="center">

    <p>&nbsp;</p>
    <table width="336" border="0">
      <tr>
        <td width="326">
          <div align="center">
            <img src="others/LOGO.jpg" width="700" height="300">
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <hr>
        </td>
      </tr>
      <tr>
        <td>
          <div id="Begin" align="center" style="font-size:25px" onMouseMove="ButtonEffect(this.id,'flash');">
            <a href="webgl.html">开始使用</a>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div align="center" id="BrowserVersion">浏览器信息未成功取得，可能无法运行。
          </div>
          <div align="center" id="LocalOpenTip" style="display:none;color:#b00020;margin-top:12px;font-size:16px;">
            检测到你正在用本地文件方式打开。请先双击运行 <b>start.bat</b>，再通过 http://localhost:8080 访问，否则模型无法加载。
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div align="center">
            <p>如果你的浏览器不支持webGL请下载
              <a href="others/谷歌浏览器 dev_23.0.1243.2.exe">chrome dev_23</a>
            </p>
            <p>使用前请关闭不必要的应用程序，以腾出更多的内存空间。</p>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div align="center">
            <p>版本信息：Beta 2.5
              <!-- #BeginDate format:Ch1m -->12/10/30 15:30
              <!-- #EndDate -->
            </p>
            <hr>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>

</html>
